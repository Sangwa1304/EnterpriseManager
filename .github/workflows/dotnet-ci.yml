name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Pin SDK feature band for CI
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "disable"
            }
          }
          EOF

      - name: Show SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore EnterpriseManager.sln -p:TargetFrameworks=net10.0

      - name: Build solution
        run: dotnet build EnterpriseManager.sln --configuration Release --no-restore -p:TargetFrameworks=net10.0

      - name: Verify xUnit runner on the CI host
        run: |
          mkdir -p /tmp/xunit-smoke
          cat > /tmp/xunit-smoke/Smoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <IsTestProject>true</IsTestProject>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NET.Test.Sdk" Version="17.14.1" />
              <PackageReference Include="xunit" Version="2.9.3" />
              <PackageReference Include="xunit.runner.visualstudio" Version="3.1.5">
                <PrivateAssets>all</PrivateAssets>
              </PackageReference>
            </ItemGroup>
          </Project>
          EOF
          cat > /tmp/xunit-smoke/Smoke.cs <<'EOF'
          using Xunit;
          public sealed class Smoke
          {
              [Fact]
              public void AdapterWorks() => Assert.True(true);
          }
          EOF
          dotnet test /tmp/xunit-smoke/Smoke.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Run domain tests
        run: |
          cat > /tmp/xunit.runsettings <<EOF
          <RunSettings>
            <RunConfiguration>
              <TestAdaptersPaths>$HOME/.nuget/packages/xunit.runner.visualstudio/3.1.5/build/net8.0</TestAdaptersPaths>
            </RunConfiguration>
          </RunSettings>
          EOF
          dotnet test tests/EnterpriseManager.Domain.Tests/EnterpriseManager.Domain.Tests.csproj \
            --configuration Release --no-build --no-restore \
            --settings /tmp/xunit.runsettings \
            --diag /tmp/domain-vstest.log \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=domain-tests.trx"
          if ! grep -Eq '<Counters[^>]*total="[1-9][0-9]*"' tests/EnterpriseManager.Domain.Tests/TestResults/domain-tests.trx; then
            echo "No domain tests were discovered."
            grep -iE 'xunit|adapter|failed|error|exception|load|discover' /tmp/domain-vstest.host.*.log /tmp/domain-vstest.log | tail -n 120 || true
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14
