name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Pin SDK feature band for CI
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "disable"
            }
          }
          EOF

      - name: Show SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore EnterpriseManager.sln -p:TargetFrameworks=net10.0

      - name: Build solution
        run: dotnet build EnterpriseManager.sln --configuration Release --no-restore -p:TargetFrameworks=net10.0

      - name: Run domain tests
        run: |
          adapter_dir="$HOME/.nuget/packages/xunit.runner.visualstudio/3.1.5/build/net8.0"
          test_dir="tests/EnterpriseManager.Domain.Tests/bin/Release/net10.0"
          dotnet vstest "$test_dir/EnterpriseManager.Domain.Tests.dll" \
            --TestAdapterPath:"$adapter_dir" \
            --ResultsDirectory:"tests/EnterpriseManager.Domain.Tests/TestResults" \
            --Diag:/tmp/domain-vstest.log \
            --logger:"console;verbosity=normal" \
            --logger:"trx;LogFileName=domain-tests.trx"
          echo "VSTest host diagnostics:"
          grep -iE 'xunit|adapter|failed|error|exception|load|discover' /tmp/domain-vstest.host.*.log /tmp/domain-vstest.log | tail -n 160 || true
          if ! grep -Eq '<Counters[^>]*total="[1-9][0-9]*"' tests/EnterpriseManager.Domain.Tests/TestResults/domain-tests.trx; then
            echo "No domain tests were discovered."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14
