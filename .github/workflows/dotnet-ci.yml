name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Show SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore EnterpriseManager.sln -p:TargetFrameworks=net10.0

      - name: Build solution
        run: dotnet build EnterpriseManager.sln --configuration Release --no-restore -p:TargetFrameworks=net10.0

      - name: Run tests
        run: |
          adapter_dir="$(find "$HOME/.nuget/packages/xunit.runner.visualstudio/4.0.1" -type f -name 'xunit.runner.visualstudio.testadapter.dll' -printf '%h\\n' | head -n 1)"
          if [ -z "$adapter_dir" ]; then
            echo "xUnit VSTest adapter DLL was not found in the restored NuGet package."
            find "$HOME/.nuget/packages/xunit.runner.visualstudio/4.0.1" -maxdepth 4 -type f
            exit 1
          fi
          echo "Using xUnit adapter from: $adapter_dir"
          dotnet test EnterpriseManager.sln --configuration Release --no-build --no-restore -p:TargetFrameworks=net10.0 \
            --test-adapter-path "$adapter_dir" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=enterprise-manager-tests.trx"
          for result in tests/*/TestResults/enterprise-manager-tests.trx; do
            if ! grep -Eq '<Counters[^>]*total="[1-9][0-9]*"' "$result"; then
              echo "No tests were discovered in $result"
              exit 1
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14
